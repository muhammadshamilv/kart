{% load static %}
<div class="account-page">
    <div class="container">
          <div class="row">

              <div class="col-2"><!--1 column for image and other for form-->
                  <img src="{% static 'images/image1.png' %}">
              </div>
              
              <div class="col-2">
                  <div class="form-container"><!--column for form-->
                      <div class="form-btn"><!--button for login and register-->
                          <span onclick="login()">Login</span><!--use js-->
                          <span onclick="register()">Register</span>
                          <hr id="Indicator" style="transform: translateX(100px);"><!--red orange bar-->
                      </div>

                      <form id="LoginForm" style="transform: translateX(0px);"><!--login form-->
                          <input type="text" placeholder="Username">
                          <input type="password" placeholder="Password">
                          <button type="Submit" class="btn">Login</button>
                          <a href="">Forgot Password?</a>
                      </form>

                      <form id="RegForm" style="transform: translateX(0px);"><!--registraition form-->
                          <input type="text" placeholder="Username">
                          <input type="email" placeholder="Email">
                          <input type="password" placeholder="Password">
                          <button type="Submit" class="btn">Register</button>
                      </form>


                  </div>
              </div>
              </div>

          </div>
      </div>
